version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: budgeting_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: budgeting_ml
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./BudgetingApp
      dockerfile: Dockerfile
    container_name: budgeting_api
    ports:
      - "7103:7103"
    environment:
      - ConnectionStrings__DefaultConnection=Server=postgres;Port=5432;Database=${POSTGRES_DB};User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_HTTP_PORT=${ASPNETCORE_HTTP_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7103/swagger"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: budgeting_dashboard
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - backend
    stdin_open: true
    tty: true

volumes:
  postgres_data:
